<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <filter id="heat-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="rgba(230,81,0,0.4)" />
  </filter>
  <g filter="url(#heat-glow)">
    <!-- Sun Core -->
    <circle cx="160" cy="160" r="70" fill="#ffb300" stroke="#d84315" stroke-width="8" />
    
    <!-- Sun Rays -->
    <path d="M 160 20 L 160 60 M 160 260 L 160 300 M 20 160 L 60 160 M 260 160 L 300 160 M 60 60 L 90 90 M 230 230 L 260 260 M 60 260 L 90 230 M 230 90 L 260 60" 
          stroke="#ff6f00" stroke-width="12" stroke-linecap="round" />

    <!-- Thermometer in center -->
    <rect x="150" y="105" width="20" height="75" rx="10" fill="#ffffff" stroke="#bf360c" stroke-width="5"/>
    <circle cx="160" cy="190" r="22" fill="#d50000" stroke="#bf360c" stroke-width="5"/>
    <rect x="154" y="125" width="12" height="55" rx="6" fill="#d50000"/>
    
    <!-- Sweat drop -->
    <path d="M 215 130 C 215 145 200 155 195 140 C 195 135 210 120 215 130 Z" fill="#29b6f6" stroke="#0277bd" stroke-width="3"/>
  </g>
</svg>
