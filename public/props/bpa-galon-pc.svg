<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620">
  <defs>
    <linearGradient id="galon-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0277bd" />
      <stop offset="15%" stop-color="#29b6f6" />
      <stop offset="35%" stop-color="#e1f5fe" />
      <stop offset="50%" stop-color="#4fc3f7" />
      <stop offset="85%" stop-color="#0288d1" />
      <stop offset="100%" stop-color="#01579b" />
    </linearGradient>
    <linearGradient id="galon-neck" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01579b" />
      <stop offset="40%" stop-color="#e1f5fe" />
      <stop offset="100%" stop-color="#01579b" />
    </linearGradient>
    <linearGradient id="cap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d47a1" />
      <stop offset="35%" stop-color="#64b5f6" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>
    <linearGradient id="ridge-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
    <filter id="jug-shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="rgba(1,87,155,0.35)" />
    </filter>
  </defs>

  <g filter="url(#jug-shadow)">
    <!-- Base Gallon Body -->
    <!-- Cap -->
    <rect x="175" y="15" width="50" height="30" rx="6" fill="url(#cap-grad)" stroke="#01579b" stroke-width="3"/>
    
    <!-- Neck -->
    <path d="M 172 45 L 228 45 L 225 90 L 175 90 Z" fill="url(#galon-neck)" stroke="#01579b" stroke-width="3"/>
    
    <!-- Shoulder Curve -->
    <path d="M 175 90 C 130 95, 75 140, 65 200 L 335 200 C 325 140, 270 95, 225 90 Z" fill="url(#galon-body)" stroke="#01579b" stroke-width="4"/>
    
    <!-- Main Cylindrical Body with Ribs -->
    <rect x="65" y="200" width="270" height="320" rx="12" fill="url(#galon-body)" stroke="#01579b" stroke-width="4"/>
    
    <!-- Horizontal Structural Ribs (Indonesian 19L Gallon Style) -->
    <!-- Rib 1 -->
    <path d="M 68 250 C 120 262, 280 262, 332 250" stroke="#01579b" stroke-width="6" fill="none" opacity="0.6"/>
    <path d="M 68 252 C 120 264, 280 264, 332 252" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.8"/>
    
    <!-- Rib 2 -->
    <path d="M 68 320 C 120 332, 280 332, 332 320" stroke="#01579b" stroke-width="6" fill="none" opacity="0.6"/>
    <path d="M 68 322 C 120 334, 280 334, 332 322" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.8"/>

    <!-- Rib 3 -->
    <path d="M 68 390 C 120 402, 280 402, 332 390" stroke="#01579b" stroke-width="6" fill="none" opacity="0.6"/>
    <path d="M 68 392 C 120 404, 280 404, 332 392" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.8"/>

    <!-- Rib 4 -->
    <path d="M 68 460 C 120 472, 280 472, 332 460" stroke="#01579b" stroke-width="6" fill="none" opacity="0.6"/>
    <path d="M 68 462 C 120 474, 280 474, 332 462" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.8"/>

    <!-- Bottom Rim -->
    <path d="M 65 520 C 65 560, 335 560, 335 520 Z" fill="url(#galon-neck)" stroke="#01579b" stroke-width="4"/>

    <!-- Vertical Specular Highlight Reflection (Gloss) -->
    <rect x="120" y="110" width="28" height="420" rx="14" fill="url(#ridge-glow)" opacity="0.75"/>
    <rect x="156" y="120" width="8" height="400" rx="4" fill="#ffffff" opacity="0.5"/>

    <!-- Front Badge Label: "PC #7" Galon -->
    <rect x="135" y="275" width="130" height="90" rx="14" fill="rgba(255,255,255,0.92)" stroke="#0277bd" stroke-width="4"/>
    <text x="200" y="315" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#d84315" text-anchor="middle">PC ♹</text>
    <text x="200" y="348" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="19" fill="#01579b" text-anchor="middle">GALON KERAS</text>
  </g>
</svg>
